name: Collecte des flux
on:
  schedule:
    - cron: "30 4 * * *"   # 05h30 Paris (hiver) ; 06h30 en été
    - cron: "0 9 * * *"    # 2e passage en milieu de matinée
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install trafilatura
      - run: python collect.py
      - name: Commit
        run: |
          git config user.name "collecte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Collecte $(date -u +%F\ %H:%M)"
          git push
